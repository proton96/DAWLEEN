<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente - Despertando al Monstruo | Atlantis Town</title>
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="icon" type="image/png" href="img/web/ui/icon-inicio.png?v=3">
    <style>
        body.coming-soon-body {
            background: #0d0617 url('img/juego/ACERTIJOS/encuentro-monstruoyrock.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .coming-soon-card {
            background: rgba(30, 14, 6, 0.94);
            border: 8px solid #c48a12;
            border-radius: 12px;
            padding: 35px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 142, 36, 0.5), var(--shadow-pixel-lg);
        }

        .pulse-monster {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            animation: pulseAwaken 2s infinite ease-in-out;
        }

        @keyframes pulseAwaken {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #43c048); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px #ff8e24); }
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .countdown-unit {
            background: #472611;
            border: 2px solid #ffcc00;
            border-radius: 6px;
            padding: 10px;
            font-family: var(--font-pixel);
        }

        .countdown-unit .number {
            font-size: 22px;
            color: #ffd700;
            display: block;
        }

        .countdown-unit .label {
            font-size: 8px;
            color: #faeed2;
        }
    </style>
</head>
<body class="coming-soon-body">
    <div class="coming-soon-card">
        <h1 class="login-spooky-title" style="font-size: 28px; margin-bottom: 10px;">
            ATLANTIS TOWN
        </h1>

        <div class="pulse-monster">
            <img src="img/juego/sprites/monstruo-miedo.png" alt="Despertando al Monstruo" style="width:100%; height:100%; object-fit:contain;" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='../img/juego/sprites/monstruo-miedo.png';}">
        </div>

        <h2 style="font-family: var(--font-pixel); font-size: 14px; color: #ffaa5b; margin-bottom: 15px;">
            DESPERTANDO AL MONSTRUO...
        </h2>

        <p style="font-family: var(--font-pixel-dialog); font-size: 22px; color: #faeed2; line-height: 1.4;">
            La niebla desciende sobre Atlantis Town. El instituto Atlántida prepara los calderos y los enigmas del bosque despiertan para la noche de Halloween.
        </p>

        <!-- Contador regresivo animado -->
        <div class="countdown-grid">
            <div class="countdown-unit">
                <span class="number" id="cdDays">00</span>
                <span class="label">DÍAS</span>
            </div>
            <div class="countdown-unit">
                <span class="number" id="cdHours">04</span>
                <span class="label">HORAS</span>
            </div>
            <div class="countdown-unit">
                <span class="number" id="cdMinutes">13</span>
                <span class="label">MINUTOS</span>
            </div>
            <div class="countdown-unit">
                <span class="number" id="cdSeconds">59</span>
                <span class="label">SEGUNDOS</span>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <a href="index.html" class="btn-pixel-play" style="font-size: 11px; padding: 10px 20px;">
                Entrar a la Villa Ahora ▶
            </a>
        </div>
    </div>

    <script>
        // Simple cuenta regresiva decorativa
        let totalSecs = 4 * 3600 + 13 * 60 + 59;
        setInterval(() => {
            if (totalSecs > 0) totalSecs--;
            const d = Math.floor(totalSecs / 86400);
            const h = Math.floor((totalSecs % 86400) / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;
            document.getElementById('cdDays').textContent = String(d).padStart(2, '0');
            document.getElementById('cdHours').textContent = String(h).padStart(2, '0');
            document.getElementById('cdMinutes').textContent = String(m).padStart(2, '0');
            document.getElementById('cdSeconds').textContent = String(s).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
