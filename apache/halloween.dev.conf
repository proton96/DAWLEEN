

<VirtualHost *:80>
    ServerAdmin webmaster@halloween.dev
    ServerName halloween.dev
    ServerAlias www.halloween.dev

    # Directorio raíz del proyecto
    DocumentRoot /var/www/halloween

    # Configuración de permisos y reescritura
    <Directory /var/www/halloween>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        DirectoryIndex index.php back/login.php
    </Directory>

    # Logs de acceso y errores dedicados
    ErrorLog ${APACHE_LOG_DIR}/halloween_error.log
    CustomLog ${APACHE_LOG_DIR}/halloween_access.log combined

    # Directiva opcional de compresión y caché para recursos estáticos
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>
</VirtualHost>
